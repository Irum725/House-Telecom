# Stage Classification & Telecom Priority Scoring Rules
# Used by backend/stage/classifier.py and backend/stage/scorer.py

stage_classification:
  # Default elapsed months from real_stcns_day to classify as NEAR_COMPLETION
  # when tot_area is missing or area adjustment is disabled.
  default_near_completion_months: 12
  use_area_adjustment: true

  # Area-adjusted thresholds (checked in ascending order of max_tot_area).
  # First matching rule where tot_area < max_tot_area applies; null means infinity.
  area_thresholds:
    - max_tot_area: 1000.0
      months: 6
    - max_tot_area: 5000.0
      months: 10
    - max_tot_area: 20000.0
      months: 12
    - max_tot_area: null
      months: 18

  # Estimated total construction duration (months) by tot_area for expected_completion_month
  estimated_duration_months:
    default_months: 14
    area_thresholds:
      - max_tot_area: 1000.0
        months: 8
      - max_tot_area: 5000.0
        months: 12
      - max_tot_area: 20000.0
        months: 16
      - max_tot_area: null
        months: 24

priority_scoring:
  weights:
    hhld_cnt: 0.35
    tot_area: 0.25
    main_purps: 0.20
    stage: 0.20

  # Piecewise linear interpolation points [value, score] for hhld_cnt (세대수)
  hhld_cnt_brackets:
    - [0, 0.0]
    - [1, 15.0]
    - [10, 35.0]
    - [50, 60.0]
    - [200, 82.0]
    - [500, 100.0]

  # Piecewise linear interpolation points [value, score] for tot_area (연면적, ㎡)
  tot_area_brackets:
    - [0.0, 0.0]
    - [300.0, 20.0]
    - [1000.0, 45.0]
    - [5000.0, 70.0]
    - [20000.0, 90.0]
    - [50000.0, 100.0]

  # Score by main_purps_cd_nm (주용도)
  purpose_scores:
    공동주택: 100.0
    아파트: 100.0
    주상복합: 95.0
    업무시설: 85.0
    오피스텔: 85.0
    숙박시설: 75.0
    판매시설: 70.0
    의료시설: 70.0
    교육연구시설: 70.0
    제1종근린생활시설: 65.0
    제2종근린생활시설: 65.0
    근린생활시설: 65.0
    다세대주택: 55.0
    연립주택: 55.0
    다가구주택: 45.0
    단독주택: 35.0
    공장: 30.0
    창고시설: 20.0

  default_purpose_score: 40.0
  empty_purpose_score: 20.0

  # Score by BuildingStage (준공 임박도)
  stage_scores:
    NEAR_COMPLETION: 100.0
    UNDER_CONSTRUCTION: 75.0
    START_SCHEDULED: 50.0
    PERMITTED: 30.0
    USE_APPROVED: 15.0
